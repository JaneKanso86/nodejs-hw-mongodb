tags:
  - Contacts
summary: Get contact by id
operationId: getContact
description: Get contact by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    description: MongoDB ObjectId
    schema:
      type: string
      pattern: '^[a-fA-F0-9]{24}$'
      example: '68962e8e5ae0a5402d96f9b6'

responses:
  '200':
    description: 'Get contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully get contact
            data:
              $ref: ../../../components/schemas/contact.yaml
        examples:
          success:
            value:
              status: 200
              message: Successfully get contact
              data:
                _id: '6682c0e4ea0a5c452d9186e6'
                name: 'Anna Smith'
                email: 'anna@example.com'
                phoneNumber: '+380671234567'
                isFavourite: true
                userId: '667f3b7f5a2f9a0012c7d111'
                photo: 'https://res.cloudinary.com/demo/image/upload/sample.jpg'
                createdAt: '2025-08-10T12:34:56.789Z'
                updatedAt: '2025-08-12T09:15:10.123Z'
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
