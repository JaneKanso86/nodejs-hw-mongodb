tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: 'Update a contact with payload'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '68950bde575b732cf4b815f6'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: +380950987985
          email:
            description: "Contact's email"
            type: string
            example: example@gmail.com
          isFavourite:
            description: 'Whether is contact favourite'
            type: boolean
            example: false
          contactType:
            description: "Contact's type"
            type: string
            enum: ['work', 'home', 'personal']
            example: personal
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '200':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
        examples:
          success:
            value:
              status: 200
              message: Successfully get contact
              data:
                _id: '6682c0e4ea0a5c452d9186e6'
                name: 'Anna Smith'
                email: 'anna@example.com'
                phoneNumber: '+380671234567'
                isFavourite: true
                userId: '667f3b7f5a2f9a0012c7d111'
                photo: 'https://res.cloudinary.com/demo/image/upload/sample.jpg'
                createdAt: '2025-08-10T12:34:56.789Z'
                updatedAt: '2025-08-12T09:15:10.123Z'
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
